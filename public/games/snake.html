<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; touch-action: manipulation; }
    .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .score-badge { background: #1e293b; padding: 6px 14px; border-radius: 8px; border: 1px solid #334155; font-size: 14px; font-weight: 700; }
    .score-badge span { color: #22c55e; }
    .canvas-container { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    canvas { display: block; background: #020617; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 6px; margin-top: 14px; }
    .d-btn { background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .d-btn:active { background: #334155; }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .hint { color: #64748b; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="score-badge">Score: <span id="score">0</span></div>
    <div class="score-badge">High: <span id="high">0</span></div>
  </div>

  <div class="canvas-container">
    <canvas id="snake" width="380" height="380"></canvas>
  </div>

  <div class="d-pad">
    <button class="d-btn btn-up" id="btn-u">▲</button>
    <button class="d-btn btn-left" id="btn-l">◀</button>
    <button class="d-btn btn-down" id="btn-d">▼</button>
    <button class="d-btn btn-right" id="btn-r">▶</button>
  </div>

  <div class="hint">Use Arrow keys or WASD to navigate</div>

  <script>
    const canvas = document.getElementById('snake');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 19;
    const TILE = canvas.width / GRID_SIZE;

    let snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 14, y: 9, type: 'apple' };
    let goldenFood = null;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_high') || '0', 10);
    document.getElementById('high').textContent = highScore;
    let gameOver = false;
    let speed = 110;
    let lastTick = 0;
    let goldenTimer = 0;

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * GRID_SIZE);
        food.y = Math.floor(Math.random() * GRID_SIZE);
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }

      if (Math.random() < 0.25 && !goldenFood) {
        let gx = Math.floor(Math.random() * GRID_SIZE);
        let gy = Math.floor(Math.random() * GRID_SIZE);
        goldenFood = { x: gx, y: gy, life: 60 };
      }
    }

    function reset() {
      snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 110;
      gameOver = false;
      goldenFood = null;
      document.getElementById('score').textContent = score;
      spawnFood();
    }

    function changeDir(x, y) {
      if (gameOver) { reset(); return; }
      if (x !== -dir.x || y !== -dir.y) {
        nextDir = { x, y };
      }
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); changeDir(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); changeDir(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); changeDir(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); changeDir(1, 0); }
      if (gameOver && e.code === 'Space') reset();
    });

    document.getElementById('btn-u').addEventListener('click', () => changeDir(0, -1));
    document.getElementById('btn-d').addEventListener('click', () => changeDir(0, 1));
    document.getElementById('btn-l').addEventListener('click', () => changeDir(-1, 0));
    document.getElementById('btn-r').addEventListener('click', () => changeDir(1, 0));

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision check
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        gameOver = true;
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > highScore) {
          highScore = score;
          document.getElementById('high').textContent = highScore;
          localStorage.setItem('snake_high', highScore);
        }
        speed = Math.max(60, 110 - Math.floor(score / 50) * 5);
        spawnFood();
      } else if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += 50;
        document.getElementById('score').textContent = score;
        goldenFood = null;
      } else {
        snake.pop();
      }

      if (goldenFood) {
        goldenFood.life--;
        if (goldenFood.life <= 0) goldenFood = null;
      }
    }

    function draw() {
      // Grid background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Faint grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, canvas.height);
        ctx.moveTo(0, i * TILE); ctx.lineTo(canvas.width, i * TILE);
        ctx.stroke();
      }

      // Draw normal food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Golden food
      if (goldenFood) {
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(goldenFood.x * TILE + TILE / 2, goldenFood.y * TILE + TILE / 2, TILE / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Draw snake
      snake.forEach((s, idx) => {
        if (idx === 0) {
          // Head
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(s.x * TILE + 1, s.y * TILE + 1, TILE - 2, TILE - 2);

          // Eyes
          ctx.fillStyle = '#0f172a';
          const eyeSize = 3;
          ctx.beginPath();
          ctx.arc(s.x * TILE + 6, s.y * TILE + 6, eyeSize, 0, Math.PI * 2);
          ctx.arc(s.x * TILE + TILE - 6, s.y * TILE + 6, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = idx % 2 === 0 ? '#16a34a' : '#15803d';
          ctx.fillRect(s.x * TILE + 2, s.y * TILE + 2, TILE - 4, TILE - 4);
        }
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Tap or Press Arrow to restart', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function gameLoop(time) {
      if (!lastTick) lastTick = time;
      if (time - lastTick > speed && !gameOver) {
        step();
        lastTick = time;
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    reset();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>

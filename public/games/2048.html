<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121826; color: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; touch-action: none; }
    .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .title { font-size: 36px; font-weight: 900; color: #f59e0b; }
    .scores { display: flex; gap: 8px; }
    .score-box { background: #1e293b; padding: 6px 14px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .score-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 18px; font-weight: bold; color: #fff; }
    .controls-row { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn:hover { background: #2563eb; }
    .btn-undo { background: #475569; }
    .btn-undo:hover { background: #334155; }
    .board-container { width: 100%; max-width: 400px; aspect-ratio: 1 / 1; background: #1e293b; border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 12px; position: relative; border: 2px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .cell { background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; transition: transform 0.12s ease, background 0.12s; }
    .tile-2 { background: #e2e8f0; color: #1e293b; }
    .tile-4 { background: #fed7aa; color: #1e293b; }
    .tile-8 { background: #fb923c; color: #fff; }
    .tile-16 { background: #f97316; color: #fff; }
    .tile-32 { background: #ef4444; color: #fff; }
    .tile-64 { background: #dc2626; color: #fff; }
    .tile-128 { background: #eab308; color: #fff; font-size: 22px; box-shadow: 0 0 10px #eab308; }
    .tile-256 { background: #facc15; color: #fff; font-size: 22px; box-shadow: 0 0 12px #facc15; }
    .tile-512 { background: #10b981; color: #fff; font-size: 22px; box-shadow: 0 0 14px #10b981; }
    .tile-1024 { background: #06b6d4; color: #fff; font-size: 18px; box-shadow: 0 0 16px #06b6d4; }
    .tile-2048 { background: #8b5cf6; color: #fff; font-size: 18px; box-shadow: 0 0 20px #8b5cf6; animation: pulse 1s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.88); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-text { font-size: 32px; font-weight: 900; color: #f59e0b; }
    .instruction { font-size: 12px; color: #64748b; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-val" id="best-score">0</div>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn btn-undo" id="undo-btn">Undo</button>
    <button class="btn" id="restart-btn">New Game</button>
  </div>

  <div class="board-container" id="board">
    <!-- 16 cells -->
    <div class="overlay" id="overlay">
      <div class="overlay-text" id="overlay-msg">Game Over!</div>
      <button class="btn" id="overlay-restart">Play Again</button>
    </div>
  </div>

  <div class="instruction">Use Arrow keys, WASD, or swipe on screen to move tiles.</div>

  <script>
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('best-score');
    const overlayEl = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const restartBtn = document.getElementById('restart-btn');
    const overlayRestart = document.getElementById('overlay-restart');
    const undoBtn = document.getElementById('undo-btn');

    let grid = Array(4).fill(null).map(() => Array(4).fill(0));
    let prevGrid = null;
    let score = 0;
    let prevScore = 0;
    let bestScore = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestScoreEl.textContent = bestScore;

    function init() {
      grid = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      updateScore(0);
      prevGrid = null;
      overlayEl.classList.remove('show');
      spawnTile();
      spawnTile();
      render();
    }

    function render() {
      // Remove old cell elements except overlay
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach(c => c.remove());

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const div = document.createElement('div');
          div.className = 'cell' + (val > 0 ? ' tile-' + val : '');
          div.textContent = val > 0 ? val : '';
          boardEl.insertBefore(div, overlayEl);
        }
      }
    }

    function spawnTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const spot = empty[Math.floor(Math.random() * empty.length)];
      grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateScore(add) {
      score += add;
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('2048_best', bestScore);
      }
    }

    function slide(row) {
      let filtered = row.filter(v => v !== 0);
      let gained = 0;
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          gained += filtered[i];
          filtered.splice(i + 1, 1);
        }
      }
      while (filtered.length < 4) filtered.push(0);
      return { newRow: filtered, gained };
    }

    function rotateGrid(times = 1) {
      let temp = grid;
      for (let t = 0; t < times; t++) {
        const next = Array(4).fill(null).map(() => Array(4).fill(0));
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            next[c][3 - r] = temp[r][c];
          }
        }
        temp = next;
      }
      return temp;
    }

    function move(dir) {
      // 0: left, 1: up, 2: right, 3: down
      prevGrid = JSON.parse(JSON.stringify(grid));
      prevScore = score;

      let rotations = 0;
      if (dir === 'up') rotations = 3;
      if (dir === 'right') rotations = 2;
      if (dir === 'down') rotations = 1;

      grid = rotateGrid(rotations);

      let moved = false;
      let roundGain = 0;
      for (let r = 0; r < 4; r++) {
        const { newRow, gained } = slide(grid[r]);
        if (JSON.stringify(newRow) !== JSON.stringify(grid[r])) moved = true;
        grid[r] = newRow;
        roundGain += gained;
      }

      grid = rotateGrid((4 - rotations) % 4);

      if (moved) {
        updateScore(roundGain);
        spawnTile();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      // Check 2048 win
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 2048) {
            overlayMsg.textContent = 'You Won 2048!';
            overlayEl.classList.add('show');
            return;
          }
        }
      }
      // Check empty spots
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return;
        }
      }
      // Check adjacent moves
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
        }
      }
      overlayMsg.textContent = 'Game Over!';
      overlayEl.classList.add('show');
    }

    undoBtn.addEventListener('click', () => {
      if (prevGrid) {
        grid = prevGrid;
        score = prevScore;
        scoreEl.textContent = score;
        prevGrid = null;
        render();
      }
    });

    restartBtn.addEventListener('click', init);
    overlayRestart.addEventListener('click', init);

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    });

    // Touch gesture support
    let startX = 0, startY = 0;
    boardEl.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    boardEl.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].clientX - startX;
      const diffY = e.changedTouches[0].clientY - startY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 30) move(diffX > 0 ? 'right' : 'left');
      } else {
        if (Math.abs(diffY) > 30) move(diffY > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    init();
  </script>
</body>
</html>

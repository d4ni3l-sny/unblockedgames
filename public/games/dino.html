<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>T-Rex Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; touch-action: manipulation; }
    .header { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .stat { font-size: 16px; font-weight: bold; color: #38bdf8; }
    .canvas-container { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 560px; max-width: 100%; }
    canvas { display: block; background: #1e293b; width: 100%; height: auto; }
    .hint { color: #64748b; font-size: 12px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="stat">SCORE: <span id="score">00000</span></div>
    <div class="stat">HI: <span id="high">00000</span></div>
  </div>

  <div class="canvas-container">
    <canvas id="dino" width="600" height="200"></canvas>
  </div>

  <div class="hint">Press Space or Up Arrow / Tap on screen to Jump. Down Arrow to duck.</div>

  <script>
    const canvas = document.getElementById('dino');
    const ctx = canvas.getContext('2d');

    let dino = { x: 50, y: 140, w: 28, h: 36, vy: 0, grounded: true, ducking: false };
    let obstacles = [];
    let clouds = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem('dino_high') || '0', 10);
    let speed = 6;
    let frames = 0;
    let gameOver = false;
    let isPlaying = false;

    document.getElementById('high').textContent = String(highScore).padStart(5, '0');

    function reset() {
      dino = { x: 50, y: 140, w: 28, h: 36, vy: 0, grounded: true, ducking: false };
      obstacles = [];
      score = 0;
      speed = 6;
      frames = 0;
      gameOver = false;
      isPlaying = true;
    }

    function jump() {
      if (!isPlaying || gameOver) { reset(); return; }
      if (dino.grounded) {
        dino.vy = -10.5;
        dino.grounded = false;
      }
    }

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp'].includes(e.code)) { e.preventDefault(); jump(); }
      if (e.code === 'ArrowDown') { e.preventDefault(); dino.ducking = true; }
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowDown') dino.ducking = false;
    });

    canvas.addEventListener('pointerdown', jump);

    function spawnObstacle() {
      const type = Math.random() > 0.35 ? 'cactus' : 'bird';
      if (type === 'cactus') {
        const count = Math.floor(Math.random() * 3) + 1;
        obstacles.push({
          x: canvas.width,
          y: 140,
          w: count * 14,
          h: 36,
          type: 'cactus'
        });
      } else {
        const heights = [100, 125, 145];
        const birdY = heights[Math.floor(Math.random() * heights.length)];
        obstacles.push({
          x: canvas.width,
          y: birdY,
          w: 32,
          h: 20,
          type: 'bird'
        });
      }
    }

    for (let i = 0; i < 4; i++) {
      clouds.push({ x: Math.random() * canvas.width, y: 30 + Math.random() * 50, speed: 0.5 + Math.random() * 0.5 });
    }

    function update() {
      if (!isPlaying || gameOver) return;
      frames++;

      // Score
      if (frames % 4 === 0) {
        score++;
        document.getElementById('score').textContent = String(score).padStart(5, '0');
        if (score > highScore) {
          highScore = score;
          document.getElementById('high').textContent = String(highScore).padStart(5, '0');
          localStorage.setItem('dino_high', highScore);
        }
        if (score % 100 === 0) speed += 0.3;
      }

      // Dino physics
      dino.vy += 0.58;
      dino.y += dino.vy;

      const floorY = dino.ducking ? 152 : 140;
      dino.h = dino.ducking ? 24 : 36;
      dino.w = dino.ducking ? 38 : 28;

      if (dino.y >= floorY) {
        dino.y = floorY;
        dino.vy = 0;
        dino.grounded = true;
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = canvas.width + 20;
      });

      // Spawn obstacles
      if (frames % Math.floor(Math.max(50, 110 - speed * 4)) === 0 && Math.random() < 0.8) {
        spawnObstacle();
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision box
        const pad = 4;
        if (
          dino.x + pad < obs.x + obs.w - pad &&
          dino.x + dino.w - pad > obs.x + pad &&
          dino.y + pad < obs.y + obs.h - pad &&
          dino.y + dino.h - pad > obs.y + pad
        ) {
          gameOver = true;
        }

        if (obs.x < -60) obstacles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 16, c.y, 18, 0, Math.PI * 2);
        ctx.arc(c.x + 32, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 176);
      ctx.lineTo(canvas.width, 176);
      ctx.stroke();

      // Ground texture dots
      ctx.fillStyle = '#64748b';
      for (let i = 0; i < 10; i++) {
        const dotX = (i * 70 + (frames * speed) % 70);
        ctx.fillRect((canvas.width - dotX), 182, 3, 2);
      }

      // Draw Dino
      ctx.fillStyle = '#22c55e';
      if (dino.ducking) {
        ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
        // Eye
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(dino.x + dino.w - 6, dino.y + 4, 3, 3);
      } else {
        // Body
        ctx.fillRect(dino.x, dino.y + 8, dino.w - 4, dino.h - 14);
        // Head
        ctx.fillRect(dino.x + 8, dino.y, 16, 12);
        // Eye
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(dino.x + 18, dino.y + 3, 3, 3);
        ctx.fillStyle = '#22c55e';
        // Legs (animated)
        if (dino.grounded) {
          const legSwing = Math.floor(frames / 4) % 2;
          ctx.fillRect(dino.x + 4, dino.y + dino.h - 6, 4, legSwing ? 6 : 2);
          ctx.fillRect(dino.x + 14, dino.y + dino.h - 6, 4, legSwing ? 2 : 6);
        } else {
          ctx.fillRect(dino.x + 6, dino.y + dino.h - 6, 4, 5);
          ctx.fillRect(dino.x + 14, dino.y + dino.h - 6, 4, 5);
        }
      }

      // Draw Obstacles
      obstacles.forEach(obs => {
        if (obs.type === 'cactus') {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          ctx.strokeStyle = '#047857';
          ctx.lineWidth = 1;
          ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        } else {
          // Bird
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(obs.x, obs.y + 4, obs.w, obs.h - 8);
          // Wings flapping
          const wingUp = Math.floor(frames / 6) % 2;
          ctx.fillRect(obs.x + 8, wingUp ? obs.y - 4 : obs.y + obs.h - 4, 12, 6);
        }
      });

      if (!isPlaying) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS SPACE OR TAP TO PLAY', canvas.width / 2, canvas.height / 2);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('G A M E   O V E R', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px monospace';
        ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>

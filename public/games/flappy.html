<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
    #canvas-container { position: relative; width: 360px; height: 560px; max-width: 100vw; max-height: 90vh; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #334155; }
    canvas { width: 100%; height: 100%; display: block; background: #38bdf8; }
    .instructions { color: #94a3b8; font-size: 13px; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas" width="360" height="560"></canvas>
  </div>
  <div class="instructions">Press Space, Click, or Tap screen to jump</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let state = 'START'; // START, PLAYING, GAMEOVER
    let bird = { x: 80, y: 250, vy: 0, radius: 14, rot: 0 };
    let pipes = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let frames = 0;
    let particles = [];

    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', dur = 0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function resetGame() {
      bird = { x: 80, y: 250, vy: 0, radius: 14, rot: 0 };
      pipes = [];
      score = 0;
      frames = 0;
      particles = [];
      state = 'PLAYING';
      playBeep(440, 'triangle', 0.1);
    }

    function flap() {
      if (state === 'START') {
        resetGame();
      } else if (state === 'PLAYING') {
        bird.vy = -6.5;
        playBeep(600, 'sine', 0.08);
      } else if (state === 'GAMEOVER') {
        resetGame();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    function createPipe() {
      const gap = 135;
      const topHeight = Math.floor(Math.random() * (canvas.height - gap - 160)) + 40;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - (topHeight + gap),
        passed: false
      });
    }

    function addParticles(x, y) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          color: Math.random() > 0.5 ? '#f59e0b' : '#ef4444',
          life: 30
        });
      }
    }

    function update() {
      frames++;

      if (state === 'PLAYING') {
        bird.vy += 0.32; // Gravity
        bird.y += bird.vy;
        bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));

        // Pipe spawn
        if (frames % 95 === 0) {
          createPipe();
        }

        // Pipe move & collision
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2.4;

          // Check pass
          if (!p.passed && p.x + 52 < bird.x) {
            p.passed = true;
            score++;
            playBeep(880, 'square', 0.12);
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('flappy_best', bestScore);
            }
          }

          // Check collision
          const bx = bird.x, by = bird.y, br = bird.radius - 2;
          if (bx + br > p.x && bx - br < p.x + 52) {
            if (by - br < p.top || by + br > canvas.height - p.bottom) {
              gameOver();
            }
          }

          if (p.x < -60) pipes.splice(i, 1);
        }

        // Floor / ceiling collision
        if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
          gameOver();
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function gameOver() {
      state = 'GAMEOVER';
      playBeep(180, 'sawtooth', 0.3);
      addParticles(bird.x, bird.y);
    }

    function draw() {
      // Sky background
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(0.7, '#7dd3fc');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(80 + (frames * 0.2) % (canvas.width + 100) - 50, 80, 24, 0, Math.PI * 2);
      ctx.arc(110 + (frames * 0.2) % (canvas.width + 100) - 50, 80, 32, 0, Math.PI * 2);
      ctx.arc(140 + (frames * 0.2) % (canvas.width + 100) - 50, 80, 24, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        // Top Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, 52, p.top);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x - 3, p.top - 20, 58, 20);
        ctx.strokeStyle = '#14532d';
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, 0, 52, p.top);
        ctx.strokeRect(p.x - 3, p.top - 20, 58, 20);

        // Bottom Pipe
        const botY = canvas.height - p.bottom;
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, botY, 52, p.bottom);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x - 3, botY, 58, 20);
        ctx.strokeRect(p.x, botY, 52, p.bottom);
        ctx.strokeRect(p.x - 3, botY, 58, 20);
      });

      // Ground
      ctx.fillStyle = '#854d0e';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

      // Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Bird
      if (state !== 'GAMEOVER' || particles.length > 0) {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rot);

        // Bird Body
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(20, 3);
        ctx.lineTo(10, 7);
        ctx.fill();

        // Wing
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.ellipse(-5, 2, 7, 4, Math.sin(frames * 0.3) * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // UI
      if (state === 'PLAYING') {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.font = '900 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeText(score, canvas.width / 2, 60);
        ctx.fillText(score, canvas.width / 2, 60);
      } else if (state === 'START') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f59e0b';
        ctx.font = '900 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FLAPPY BIRD', canvas.width / 2, 200);

        ctx.fillStyle = '#fff';
        ctx.font = '600 18px sans-serif';
        ctx.fillText('Tap or Space to Flap', canvas.width / 2, 260);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText(`Best Score: ${bestScore}`, canvas.width / 2, 310);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.font = '900 34px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 190);

        ctx.fillStyle = '#fff';
        ctx.font = '700 24px sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 240);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '600 18px sans-serif';
        ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, 280);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '600 18px sans-serif';
        ctx.fillText('Tap to Play Again', canvas.width / 2, 340);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
